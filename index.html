<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Single-School Attendance Management System</title>
    <meta name="description" content="Production-grade attendance management system for single schools with Principal and Teacher roles, biometric/SMS OTP forgot password, dynamic class-subject assignment, locked attendance sessions, audit logging, and openpyxl Excel reporting." />
    <meta property="og:title" content="Single-School Attendance Management System" />
    <meta property="og:description" content="Production-grade attendance management system for single schools with Principal and Teacher roles, biometric/SMS OTP forgot password, dynamic class-subject assignment, locked attendance sessions, audit logging, and openpyxl Excel reporting." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/static/css/main.css" />
    <link rel="stylesheet" href="/static/css/auth.css" />
  </head>
  <body style="background:#0F172A;color:#FFFFFF;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <div style="text-align:center;padding:2rem;">
      <div class="spinner" style="margin:0 auto 1.25rem;width:2.5rem;height:2.5rem;border-width:3px;"></div>
      <h2 style="font-size:1.25rem;font-weight:700;margin-bottom:0.5rem;color:#F8FAFC;">संस्कार हाई स्कूल, गरोडा</h2>
      <p style="color:#94A3B8;font-size:0.9rem;">Connecting to Attendance Management System...</p>
    </div>

    <script src="/static/js/api.js"></script>
    <script>
      (function() {
        const user = API.getStoredUser();
        if (user && user.role === "principal") {
          window.location.replace("/principal");
        } else if (user && user.role === "teacher") {
          window.location.replace("/teacher");
        } else {
          window.location.replace("/login");
        }
      })();
    </script>
  </body>
</html>
